<form class="period d-flex flex-wrap align-items-end gap-2" method="get">
    
    

<input type="hidden" name="from" value="2026-09-01">
<input type="hidden" name="to" value="2026-09-30">
<div class="daterange" data-daterange data-daterange-rules="{&#34;max_days&#34;:366,&#34;reversed&#34;:&#34;The last day comes before the first day.&#34;,&#34;too_long&#34;:&#34;Choose a period of at most a year.&#34;}">
  <button class="daterange-trigger" type="button" data-daterange-trigger
          aria-haspopup="dialog" aria-expanded="false">
    <svg class="daterange-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-daterange-label>1 Sep 2026 – 30 Sep 2026 (UTC)</span>
  </button>

  <div class="daterange-panel" data-daterange-panel role="dialog"
       aria-label="Choose a period" hidden>
    <ul class="daterange-presets" data-daterange-presets></ul>

    <div class="daterange-body">
      <div class="daterange-months">
        <div class="daterange-month" data-daterange-month="0"></div>
        <div class="daterange-month" data-daterange-month="1"></div>
      </div>
      <p class="daterange-note" data-daterange-note role="status"></p>
    </div>

    <div class="daterange-foot">
      <p class="daterange-selected mb-0">Selected:
        <strong data-daterange-summary></strong></p>
      <div class="daterange-actions">
        <button class="btn btn-sm btn-outline-secondary" type="button"
                data-daterange-cancel>Cancel</button>
        <button class="btn btn-sm btn-primary" type="button"
                data-daterange-apply>Apply range</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/static/daterange.js"></script>

  </form>

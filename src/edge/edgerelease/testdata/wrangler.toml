# The project for www.publisher.example, ready to deploy. Generated for this domain; the
# worker file beside it is the release every publisher installs.
name = "fora-www-publisher-example-23100b9a"
main = "fora-worker.mjs"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# The whole hostname, so the Worker sees every path it may have to guard. It
# passes your own /.well-known/fora.json and /rsl.txt through to your site.
routes = [
  { pattern = "www.publisher.example/*", zone_name = "publisher.example" }
]

# Your settings. None of them is a secret: the Worker verifies a delivered
# address against the exchange's public keys, which it fetches for itself.
[vars]
EXCHANGE_URL = "https://exchange.example"
EXCHANGE_WBA_URL = "https://exchange.example/.well-known/http-message-signatures-directory"
FORA_ENFORCE_BINDING = "true"
FORA_VERIFY_KEYS = "[{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"x\":\"l3cHOINRwzU9vsPaa4_UlbRlCQeb1OpNNXOdC3sjlb4\"}]"
LICENSED_PATHS_JSON = "[\"/article/\",\"/q&a/\"]"
SAME_ZONE_ORIGIN = "true"

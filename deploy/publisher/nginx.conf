# E2E origin nginx: serves the baseline mock-publisher tree at the default
# docroot AND the Phase-2 demo content tree under its own docroot, routed by
# path prefix. The demo publishers use disjoint prefixes (/articles, /lyrics,
# /tracks, /sfx, plus Harmonia's /licensing/harmonia documents) so there is
# no collision with the baseline tree (/premium, /public, /paid, /.well-known).
# Separate roots avoid mounting demo subtrees underneath the read-only baseline
# docroot (which the daemon cannot create child mountpoints in).
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events { worker_connections 64; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/plain text/css text/markdown application/javascript application/json;
    sendfile      on;
    access_log    /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name _;

        # This origin stands in for a publisher site behind a CDN, so it
        # announces itself as one. The console's onboarding works out which
        # network serves a domain from its DNS records and its response
        # headers; inside a compose network there are no CDN records to read,
        # so the header is the only evidence there is. Without it the console
        # reports "we could not work out which network serves your domain" and
        # the onboarding test stops at its first step.
        add_header cf-ray "e2e0000000000000-FRA" always;

        # Baseline mock-publisher tree (article-42, licensed-paper, public/, etc.).
        root /usr/share/nginx/html;

        # Human-facing landing page: the demo catalog index at the site root.
        # A person opening the demo hostname in a browser lands here; every
        # other path keeps its routing below (exact match). try_files serves
        # the file inside this location — an `index` directive would instead
        # internally redirect to /index.html, re-match locations, and fall
        # into the baseline docroot where the file does not exist.
        location = / {
            root /usr/share/nginx/demo;
            try_files /index.html =404;
        }

        # Phase-2 demo publisher content. Each prefix maps to the matching
        # subtree under /usr/share/nginx/demo. The edge forwards the signed-URL
        # path verbatim, so e.g. /articles/philosophers/thales-of-miletus.txt is
        # read straight from the Stoa Press tree.
        location /articles/ { root /usr/share/nginx/demo/stoa-press; }
        # nginx's MIME table has no entry for .md, so the Markdown essays would
        # otherwise go out as application/octet-stream. A regex location wins
        # over the prefix location above; the root is the same Stoa Press tree.
        location ~ ^/articles/.*\.md$ {
            root /usr/share/nginx/demo/stoa-press;
            default_type text/markdown;
        }
        location /lyrics/   { root /usr/share/nginx/demo/harmonia-records; }
        location /tracks/   { root /usr/share/nginx/demo/harmonia-records; }
        location /sfx/      { root /usr/share/nginx/demo/foleyworks; }
        # Harmonia's license documents. They sit outside the four prefixes
        # above so an edge that licenses only those prefixes lets an agent
        # read the terms before it buys.
        location /licensing/harmonia/ { root /usr/share/nginx/demo/harmonia-records; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

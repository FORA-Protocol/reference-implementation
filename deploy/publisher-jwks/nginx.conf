worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

# One process answers every identity's host, and the capture proxy keeps a pool
# of open connections per host name it forwards to.
events { worker_connections 256; }

http {
    include       mime.types;
    default_type  application/json;
    sendfile      on;
    access_log    /var/log/nginx/access.log combined;
    # Room for the longest identity name (archive.demo.fora-protocol.org).
    server_names_hash_bucket_size 64;

    # The catch-all, first and marked default_server: every request whose Host
    # names no identity lands here, the container's own health probe included.
    # It serves the probe and 404 for everything else, so a request under an
    # unknown or misspelled name never receives an identity's keys.
    server {
        listen      80 default_server;
        server_name _;

        # Health probe for the compose healthcheck.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / { return 404; }
    }

    # One server per identity, each under its own host name only. The entrypoint
    # writes them at every start, from the keys mounted under /keys.
    include /etc/nginx/hosts/*.conf;
}

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events { worker_connections 32; }

http {
    include       mime.types;
    default_type  application/json;
    sendfile      on;
    access_log    /var/log/nginx/access.log combined;

    server {
        listen              80;
        server_name         _;

        root /var/www/fora;

        # The commercial overlay manifest (keyless after the WBA split).
        location = /.well-known/fora.json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # The Web Bot Auth directory the CatalogSignatureMiddleware self-signup
        # path fetches to resolve the catalog-contributor's pubkey by thumbprint.
        # Served with the profile's media type and the response signature the
        # entrypoint made for this host (directory-signature.conf).
        location = /.well-known/http-message-signatures-directory {
            default_type application/http-message-signatures-directory+json;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/directory-signature.conf;
            try_files $uri =404;
        }

        # Health probe for the compose healthcheck.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / { return 404; }
    }
}

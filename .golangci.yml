version: "2"

run:
  # Sized for a CACHE-COLD run, not a warm one. The runners have no shared cache
  # server, so a job landing on a slot that has not built this project before
  # starts with an empty build cache, and the module cache is never cached at
  # all (a torn archive corrupted CI once). Such a run re-downloads every module
  # and compiles the whole dependency graph before a single linter executes: one
  # measured at 5m48s and tripped the previous 5m limit, having already printed
  # "0 issues". A warm run is well under a minute, so this ceiling costs nothing
  # when the cache is there and stops a cold slot failing a clean branch.
  timeout: 15m
  tests: true

severity:
  default: error

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - nilerr
    - noctx
    - wastedassign

    # Security
    - gosec

    # Style / complexity / size
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - lll
    - maintidx
    - nestif
    - revive
    - unconvert
    - unparam
    - misspell
    - prealloc
    - gocritic

    # Architecture
    - depguard
    # ADR-008 D1: time is a port; the wall clock is a leaf.
    - forbidigo
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 120
      tab-width: 1
    maintidx:
      under: 20
    nestif:
      min-complexity: 5
    gosec:
      excludes:
        - G104 # handled by errcheck
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: file-length-limit
          arguments:
            - max: 500
              skipBlankLines: false
              skipComments: false
    depguard:
      rules:
        # Canonical signing payloads (RFC 8785 JCS over proto-JSON) are
        # SDK-internal; app code signs/verifies through the SDK faces. The
        # structural guard test (internal/guards) carries the same ban as
        # belt-and-suspenders.
        no-hand-rolled-canonicalization:
          deny:
            - pkg: "github.com/gowebpki/jcs"
              desc: "JCS canonicalization is SDK-internal; sign/verify through the sdk/go faces"
        # Services must not depend on each other, and shared code outside the
        # two service trees must not reach into either. depguard applies a
        # rule with a negation-only files list to every file EXCEPT the
        # negated globs — so this rule covers only the code OUTSIDE both
        # services; the per-tree rules below carry the ban INSIDE each
        # service. NOTE: today every service package sits under a Go
        # `internal/` segment, so the compiler already refuses these imports
        # (probe files fail typecheck before depguard runs); the rules here
        # are declarative intent that bites the day a non-internal package
        # appears under either service tree.
        no-circular-internal:
          deny:
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/exchange"
              desc: "shared code must not import exchange internals; use protocol via Connect-Go"
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/broker"
              desc: "shared code must not import broker internals; use protocol via Connect-Go"
          files:
            - "!**/src/broker/**"
            - "!**/src/exchange/**"
            - "!**/src/console/**/*_test.go"
        # The console's test files are the one place outside the Exchange that
        # may import it, and only its in-process harness. The Testing Doctrine
        # forbids a console test from standing in for the Exchange, and Go's
        # internal visibility keeps the console from composing the Exchange
        # itself, so src/exchange/exchangetest is the only way to run the real
        # registration surface under a console test. Production console code
        # stays under no-circular-internal above and may not import it.
        # Everything else under src/exchange stays denied here: the longer
        # allow match wins only for exchangetest (lax mode: anything not denied
        # is allowed, and a package in both lists goes to the longer pattern).
        # The harness and every test that imports it carry the integration
        # tag, so this rule is enforced by the `--build-tags integration` lint
        # pass that `make lint` runs alongside the untagged one.
        console-tests-exchange-harness-only:
          list-mode: lax
          allow:
            - "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/exchange/exchangetest"
          deny:
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/exchange"
              desc: "console tests may import only the Exchange's in-process harness (src/exchange/exchangetest)"
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/broker"
              desc: "shared code must not import broker internals; use protocol via Connect-Go"
          files:
            - "**/src/console/**/*_test.go"
        broker-no-exchange-internals:
          deny:
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/exchange"
              desc: "broker must not import exchange internals; use protocol via Connect-Go"
          files:
            - "**/src/broker/**"
        exchange-no-broker-internals:
          deny:
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/broker"
              desc: "exchange must not import broker internals; use protocol via Connect-Go"
          files:
            - "**/src/exchange/**"
        # The purchase service layer sits below the transport adapter; the
        # dependency points transport→purchase only (symmetric to the clean
        # internal/resolve package).
        broker-purchase-no-transport:
          deny:
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/broker/internal/transport"
              desc: "internal/purchase must not import transport; ports are locally-owned structural interfaces"
          files:
            - "**/src/broker/internal/purchase/**"
    # ADR-008 D1 — wall-clock primitives are forbidden inside the policy
    # trees. Production code consults the injected clock.Clock; only the
    # canonical leaf in internal/clock and the production roots that
    # construct clock.System{} may reference time.Now / time.Since /
    # time.Until directly. The allowlist below is enforced via per-path
    # exclusions further down (see "exclusions").
    forbidigo:
      analyze-types: false
      forbid:
        - pattern: '^time\.Now$'
          msg: "ADR-008 D1: consult the injected clock.Clock, not time.Now"
        - pattern: '^time\.Since$'
          msg: "ADR-008 D1: derive elapsed time from clock.Clock.Now(), not time.Since"
        - pattern: '^time\.Until$'
          msg: "ADR-008 D1: derive remaining time from clock.Clock.Now(), not time.Until"

  exclusions:
    rules:
      # ADR-008 D1 forbidigo allowlist: the canonical clock leaf.
      - path: 'internal/clock/'
        linters:
          - forbidigo
      # Production roots may reference the wall clock when constructing
      # the system clock or stamping startup-time metadata that does not
      # gate behaviour at request time.
      - path: 'src/exchange/cmd/server/'
        linters:
          - forbidigo
      - path: 'src/broker/cmd/server/'
        linters:
          - forbidigo
      # Tests are exempt — they construct deterministic clocks of their
      # own choosing and may read the wall clock to derive a fixed anchor.
      - path: _test\.go
        linters:
          - forbidigo
      # Relax a few size/security lints inside tests only.
      - path: _test\.go
        linters:
          - gosec
          - gocyclo
          - gocognit
          - funlen
          - lll
          - maintidx
      # Test files take the 800-line cap that scripts/check-file-length.py
      # enforces for every language, not revive's 500-line source cap. Before
      # the build-tagged lint passes existed revive never loaded a tagged test
      # file, so the two caps had not met; the length gate owns test files.
      - path: _test\.go
        text: 'file-length-limit'
        linters:
          - revive
      # Generated code is exempt across the board (sqlc output trees: the
      # Exchange/Broker main DBs and the SoR's own DB).
      - path: 'internal/(db|sor/db)/sqlc/'
        linters:
          - revive
          - unused
          - gosec
          - lll
          - gocritic
      # gosec G204 (subprocess with a variable argument): fora-ledger reads the
      # edge delivery logs by running the aws CLI. The command name is a
      # constant and the arguments are passed as an argv array, so no shell
      # parses them and there is no command string to inject into. The reachable
      # risk is the CLI's OWN flag parser reading a dashed value as an option,
      # and checkAWSArgs refuses that before the call: the region must match the
      # AWS region grammar, the log group the CloudWatch name grammar, and the
      # filter pattern must be a hex digest. gosec flags any non-literal
      # argument and cannot see that guard.
      - path: 'src/broker/cmd/fora-ledger/edgelog.go'
        text: 'G204'
        linters:
          - gosec
      # gosec G204 again, for the browser launcher in the same tool: the command
      # is a constant (`open` or `xdg-open`) and its one argument is the path of
      # the report this process has just written, passed as argv with no shell.
      - path: 'src/broker/cmd/fora-ledger/html.go'
        text: 'G204'
        linters:
          - gosec
      # gosec G704 (SSRF via taint analysis): SSRF is a server being tricked
      # into making a request on someone else's behalf. fora-ledger is an
      # operator CLI, and the URL it fetches is the one the operator typed on
      # their own command line, so there is no other party whose input reaches
      # it. gosec sees only that a flag and an environment variable reach
      # http.NewRequestWithContext, which is the tool's entire purpose.
      # Routing this through the SDK's SSRF-guarded client would break it: the
      # admin plane is not exposed, so the URL is normally a loopback tunnel
      # such as http://127.0.0.1:8091, exactly what that guard rejects.
      # evidenceURL still refuses a scheme that is not http or https and a URL
      # with no host, so a typo fails on its own message rather than at the
      # transport.
      - path: 'src/broker/cmd/fora-ledger/fetch.go'
        text: 'G704'
        linters:
          - gosec
      # gosec G705 (XSS via taint analysis) does not apply to the Broker's
      # writeProtoJSON: the payload is server-built canonical proto-JSON written
      # with Content-Type application/json, never user-reflected HTML.
      - path: 'src/broker/internal/transport/middleware.go'
        text: 'G705'
        linters:
          - gosec
      # gosec G124: the developer sign-up flow cookies ARE HttpOnly and
      # SameSite=Lax; only the Secure attribute is config-driven
      # (oauthserver.Config.SecureCookies) so a local http compose/test stack
      # works. oauthserver.New refuses an https issuer unless SecureCookies is
      # true, so production cookies are always Secure — gosec cannot follow that
      # cross-function guard and flags the non-literal Secure value.
      - path: 'src/identity/internal/oauthserver/cookies.go'
        text: 'G124'
        linters:
          - gosec
      # gosec G710 (open redirect via taint analysis): every redirect target is
      # the client's registered redirect_uri, validated by allowedRedirect (exact
      # match against the stored allowlist) at /authorize before being sealed into
      # the flow cookie; every redirectWith caller passes an already-validated URI.
      # Taint analysis cannot follow that validation through the sealed cookie.
      - path: 'src/identity/internal/oauthserver/redirect.go'
        text: 'G710'
        linters:
          - gosec
      # gosec G124: the publisher console's cookies ARE HttpOnly and
      # SameSite=Lax; only the Secure attribute is config-driven
      # (app.Config.SecureCookies) so a local http bring-up still works.
      # app.Build refuses an https public origin unless SecureCookies is true,
      # so a production cookie is always Secure — gosec cannot follow that
      # cross-function guard and flags the non-literal Secure value. Both the
      # set and the clear path go through cookieWriter, so the two cannot drift
      # on the attributes this exclusion covers.
      - path: 'src/console/internal/auth/session.go'
        text: 'G124'
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
